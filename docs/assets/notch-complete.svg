<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Just Talk macOS 刘海识别完成界面预览</title>
  <desc id="desc">产品示意：黑色渐变背景上的 macOS 刘海完成状态，展示最终中文识别文字和已复制提示。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111318"/>
      <stop offset="0.52" stop-color="#090a0d"/>
      <stop offset="1" stop-color="#17191f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#272a32"/>
      <stop offset="1" stop-color="#17191f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72e7b1"/>
      <stop offset="1" stop-color="#37bd84"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity="0.52"/>
    </filter>
  </defs>

  <rect width="1200" height="600" rx="28" fill="url(#bg)"/>
  <path d="M0 102C220 58 370 68 600 106s380 48 600-2V0H0Z" fill="#1b1e25" opacity=".5"/>
  <text x="72" y="82" fill="#858b99" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif" font-size="17" letter-spacing="2">JUST TALK · macOS 刘海界面预览</text>

  <!-- Isolated black notch shape; no desktop or window chrome is shown. -->
  <g filter="url(#shadow)">
    <path d="M413 116h374v27c0 38-30 68-68 68H481c-38 0-68-30-68-68Z" fill="#020204"/>
    <circle cx="441" cy="145" r="5" fill="#72e7b1"/>
    <path d="m752 140 5 5 9-10" fill="none" stroke="#72e7b1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
    <text x="462" y="151" fill="#f2f5f7" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif" font-size="16" font-weight="600">识别完成</text>
    <text x="749" y="151" text-anchor="end" fill="#727987" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif" font-size="13">已复制</text>

    <rect x="330" y="228" width="540" height="238" rx="32" fill="url(#panel)" stroke="#343944" stroke-width="1"/>
    <circle cx="388" cy="278" r="13" fill="url(#accent)"/>
    <path d="m382 278 4 4 8-9" fill="none" stroke="#082719" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
    <text x="416" y="284" fill="#9debc8" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif" font-size="15" font-weight="600">识别完成 · 已复制到剪贴板</text>
    <text x="378" y="345" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif" font-size="30" font-weight="600">帮我把这段内容整理成</text>
    <text x="378" y="388" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif" font-size="30" font-weight="600">一份简洁的会议摘要</text>
    <rect x="378" y="420" width="444" height="2" rx="1" fill="#3a414c"/>
    <text x="378" y="449" fill="#7f8795" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif" font-size="14">00:08  ·  24 个字</text>
  </g>
  <text x="600" y="548" text-anchor="middle" fill="#666d7a" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif" font-size="14">产品示意 · 录音完成状态</text>
</svg>
