name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: just-talk-release
  cancel-in-progress: false

env:
  GO_VERSION: "1.25.x"
  GORELEASER_VERSION: "v2.17.0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            runner: ubuntu-24.04
            target: linux-amd64
            goos: linux
            goarch: amd64
            cgo_enabled: "1"
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: linux-arm64
            goos: linux
            goarch: arm64
            cgo_enabled: "1"
          - name: macOS Intel
            runner: macos-15-intel
            target: darwin-amd64
            goos: darwin
            goarch: amd64
            cgo_enabled: "1"
          - name: macOS Apple Silicon
            runner: macos-15
            target: darwin-arm64
            goos: darwin
            goarch: arm64
            cgo_enabled: "1"
          - name: Windows amd64
            runner: windows-2025
            target: windows-amd64
            goos: windows
            goarch: amd64
            cgo_enabled: "0"
          - name: Windows arm64
            runner: windows-11-arm
            target: windows-arm64
            goos: windows
            goarch: arm64
            cgo_enabled: "0"

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check stable release tag
        shell: bash
        run: '[[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Linux native dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libwayland-dev \
            libx11-dev \
            libxext-dev \
            libxinerama-dev \
            libxrender-dev \
            libxtst-dev

      - name: Test
        env:
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
        run: |
          go test ./...
          go vet ./...

      - name: Build archive with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --snapshot --skip=publish,validate
        env:
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ github.ref_name }}

      - name: Upload archive
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out maintenance branch
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Download archives
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/*.tar.gz \
              dist/*.zip \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/*.tar.gz \
              dist/*.zip \
              dist/SHA256SUMS.txt \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi

      - name: Update Homebrew formula
        run: |
          python3 scripts/update_homebrew.py "${GITHUB_REF_NAME}" dist/SHA256SUMS.txt
          ruby -c Formula/just-talk.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/just-talk.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore: 更新 Homebrew 配方至 ${GITHUB_REF_NAME}"
            git push origin HEAD:master
          fi
